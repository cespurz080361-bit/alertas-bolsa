name: Alertas de bolsa

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alertas-bolsa
  cancel-in-progress: false

jobs:
  alertas:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Instalar Python 3.11 (con caché de pip)
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar un ciclo de alertas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alertas_bolsa_telegram.py --una-vez

      - name: Guardar el estado (precios de referencia)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f estado_alertas.json ]; then
            git add estado_alertas.json
            if ! git diff --cached --quiet; then
              git commit -m "Estado: actualización automática de precios"
              git pull --rebase --autostash || true
              git push
            else
              echo "El estado no cambió; nada que guardar."
            fi
          else
            echo "Sin fichero de estado; nada que guardar."
          fi
